[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-lm"
version = "0.1.0"
description = "HYDRA-LM hybrid GQA / Gated-DeltaNet LLM"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.16.0",
    "tiktoken>=0.14.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hydra_lm*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
